<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fun Fantasy</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'Arial Rounded MT Bold', sans-serif;
      background: repeating-linear-gradient(
        45deg,
        #1a1a1a,
        #1a1a1a 5px,
        #111 5px,
        #111 10px
      );
      color: #fff;
      overflow-x: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background-color: #f8d99e;
      padding: 10px;
      font-weight: bold;
      font-size: 24px;
    }

    .header a {
      color: black;
      text-decoration: none;
    }

    .menu-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      background-color: #f8d99e;
      color: black;
      font-weight: bold;
      text-align: center;
      line-height: 30px;
      border: 1px solid #000;
      border-radius: 6px;
      cursor: pointer;
      font-size: 20px;
    }

    .side-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 80vw;
      max-width: 400px;
      height: 100%;
      background-color: #000;
      color: #f8d99e;
      padding: 20px;
      box-shadow: 2px 0 5px rgba(0,0,0,0.5);
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      z-index: 1000;
      overflow-y: auto;
    }

    .side-menu.open {
      transform: translateX(0);
    }

    .side-menu ul {
      list-style: none;
      padding: 0;
      margin-top: 60px;
    }

    .side-menu li {
      margin: 15px 0;
      font-size: 18px;
      cursor: pointer;
      transition: color 0.2s ease, background-color 0.2s ease;
      padding: 5px 10px;
      border-radius: 4px;
    }

    .side-menu li:hover {
      color: #a7f3ce;
    }

    .side-menu li.active {
      background-color: #f8d99e;
      color: black;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: transparent;
      border: none;
      color: #f8d99e;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
      line-height: 1;
      padding: 0;
    }

    .close-btn:hover {
      color: #a7f3ce;
    }

    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      z-index: 999;
    }

    .overlay.show {
      display: block;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px 20px 20px;
      color: #f8d99e;
    }

    .top-section {
      text-align: center;
      margin-bottom: 30px;
    }

    .marquee {
      overflow: hidden;
      white-space: nowrap;
      box-sizing: border-box;
    }

    .marquee h2 {
      display: inline-block;
      padding-left: 100%;
      animation: marquee 10s linear infinite;
      font-weight: bold;
      font-size: 24px;
      margin: 0;
    }

    @keyframes marquee {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-100%, 0); }
    }

    .budget {
      font-size: 32px;
      margin: 15px 0 0;
    }

    .form-section {
      display: flex;
      flex-direction: column;
      gap: 20px;
      text-align: left;
    }

    .form-section label {
      color: #a7f3ce;
      font-size: 16px;
      margin-bottom: 5px;
    }

    select {
      width: 100%;
      max-width: 100%;
      height: 56px;
      padding: 10px;
      font-size: 16px;
      background-color: #a7f3ce;
      border: none;
      border-radius: 5px;
      overflow-x: hidden;
    }

    .submit-btn {
      background-color: #f8d99e;
      color: black;
      padding: 15px;
      height: 56px;
      margin-top: 30px;
      width: 100%;
      border: none;
      font-weight: bold;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      .header {
        font-size: 20px;
      }

      .menu-icon {
        width: 26px;
        height: 26px;
        font-size: 18px;
      }

      .budget {
        font-size: 24px;
      }

      select {
        font-size: 15px;
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <button class="menu-icon" onclick="toggleMenu()">≡</button>
    <a href="/">Fun Fantasy</a>
  </div>

  <div class="side-menu" id="sideMenu">
    <button class="close-btn" onclick="closeMenu()">×</button>
    <ul>
      <li class="active">Турніри</li>
      <li>Турніри</li>
      <li>Команда</li>
      <li>Вихід</li>
    </ul>
  </div>

  <div class="overlay" id="overlay" onclick="closeMenu()"></div>

  <div class="container">
    <div class="top-section">
      <div class="marquee">
        <h2>Наберіть команду</h2>
      </div>
      <div class="budget">
        50 <span style="font-size: 28px; background-color: #f8d99e; color: black; padding: 2px 6px; border-radius: 4px">&#162;</span>
      </div>
    </div>

    <div class="form-section">
      <div>
        <label for="carry">Керрі:</label>
        <select id="carry">
          <option>{{ current_carry.player.nickname }}</option>
          {% for player in players_carry %}
            <option>{{ player.nickname }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label for="mid">Мід:</label>
        <select id="mid">
          <option>{{ current_mid.player.nickname }}</option>
          {% for player in players_mid %}
            <option>{{ player.nickname }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label for="offlane">Оффлейн:</label>
        <select id="offlane">
          <option>{{ current_offlane.player.nickname }}</option>
          {% for player in players_offlane %}
            <option>{{ player.nickname }}</option>
          {% endfor %}

        </select>
      </div>

      <div>
        <label for="semi-support">Семі Сапорт:</label>
        <select id="semi-support">
          <option>{{ current_semi_support.player.nickname }}</option>
          {% for player in players_semi_support %}
            <option>{{ player.nickname }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label for="full-support">Фулл Сапорт:</label>
        <select id="full-support">
          <option>{{ current_full_support.player.nickname }}</option>
          {% for player in players_full_support %}
            <option>{{ player.nickname }}</option>
          {% endfor %}
        </select>
      </div>

      <button class="submit-btn">ПІДТВЕРДИТИ</button>
    </div>
  </div>

  <script>
    function toggleMenu() {
      const menu = document.getElementById('sideMenu');
      const overlay = document.getElementById('overlay');
      if (!menu.classList.contains('open')) {
        menu.classList.add('open');
        overlay.classList.add('show');
        document.body.style.overflow = 'hidden';
      } else {
        closeMenu();
      }
    }

    function closeMenu() {
      document.getElementById('sideMenu').classList.remove('open');
      document.getElementById('overlay').classList.remove('show');
      document.body.style.overflow = '';
    }

    // Активне меню
    document.querySelectorAll('.side-menu li').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.side-menu li').forEach(li => li.classList.remove('active'));
        item.classList.add('active');
      });
    });
  </script>
</body>
</html>
