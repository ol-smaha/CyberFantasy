
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fun Fantasy</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'Arial Rounded MT Bold', sans-serif;
      background: repeating-linear-gradient(
        45deg,
        #1a1a1a,
        #1a1a1a 5px,
        #111 5px,
        #111 10px
      );
      color: #fff;
      overflow-x: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background-color: #f8d99e;
      padding: 10px;
      font-weight: bold;
      font-size: 24px;
    }

    .header a {
      color: black;
      text-decoration: none;
    }

    .menu-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      background-color: #f8d99e;
      color: black;
      font-weight: bold;
      text-align: center;
      line-height: 30px;
      border: 1px solid #000;
      border-radius: 6px;
      cursor: pointer;
      font-size: 20px;
    }

    .side-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 80vw;
      max-width: 400px;
      height: 100%;
      background-color: #000;
      color: #f8d99e;
      padding: 20px;
      box-shadow: 2px 0 5px rgba(0,0,0,0.5);
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      z-index: 1000;
      overflow-y: auto;
    }

    .side-menu.open {
      transform: translateX(0);
    }

    .side-menu ul {
      list-style: none;
      padding: 0;
      margin-top: 60px;
    }

    .side-menu li {
      margin: 15px 0;
      font-size: 18px;
      cursor: pointer;
      transition: color 0.2s ease, background-color 0.2s ease;
      padding: 5px 10px;
      border-radius: 4px;
    }

    .side-menu li:hover {
      color: #a7f3ce;
    }

    .side-menu li.active {
      background-color: #f8d99e;
      color: black;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: transparent;
      border: none;
      color: #f8d99e;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
      line-height: 1;
      padding: 0;
    }

    .close-btn:hover {
      color: #a7f3ce;
    }

    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      z-index: 999;
    }

    .overlay.show {
      display: block;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      color: #f8d99e;
    }

    .login-form {
      width: 100%;
      max-width: 400px;
      background-color: #222;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .login-form label {
      display: block;
      margin-bottom: 5px;
      color: #a7f3ce;
    }

    .login-form input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .submit-btn {
      background-color: #f8d99e;
      color: black;
      padding: 15px;
      height: 56px;
      width: 100%;
      border: none;
      font-weight: bold;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
    }

    .register-link {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #a7f3ce;
      cursor: pointer;
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .header {
        font-size: 20px;
      }

      .menu-icon {
        width: 26px;
        height: 26px;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <button class="menu-icon" onclick="toggleMenu()">≡</button>
    <a href="/">Fun Fantasy</a>
  </div>

  <div class="side-menu" id="sideMenu">
    <button class="close-btn" onclick="closeMenu()">×</button>
    <ul>
      <li>Турніри</li>
      <li>Команда</li>
      <li>Вихід</li>
    </ul>
  </div>

  <div class="overlay" id="overlay" onclick="closeMenu()"></div>

  <div class="container">
    <p> {{ user.email }} - {{ user.username }}</p>
    <form method="post" action="{{ app_path }}" class="login-form" id="login-form">
      {% csrf_token %}
      <p class="form-text error-text">
        {{ form.non_field_errors.as_text }}
      </p>

      <div class="input-group">
        {{ form.email.errors }}
        <label>Емейл:</label>
        {{ form.email }}
      </div>
      <button type="submit" class="submit-btn" id="loginButton">Скинути пароль</button>

      <a class="register-link" href="#">Увійти</a>
      <a class="register-link" href="#">Зареєструватись</a>
    </form>
  </div>

  <script>
    function toggleMenu() {
      const menu = document.getElementById('sideMenu');
      const overlay = document.getElementById('overlay');
      if (!menu.classList.contains('open')) {
        menu.classList.add('open');
        overlay.classList.add('show');
        document.body.style.overflow = 'hidden';
      } else {
        closeMenu();
      }
    }

    function closeMenu() {
      document.getElementById('sideMenu').classList.remove('open');
      document.getElementById('overlay').classList.remove('show');
      document.body.style.overflow = '';
    }

    document.querySelectorAll('.side-menu li').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.side-menu li').forEach(li => li.classList.remove('active'));
        item.classList.add('active');
      });
    });
  </script>
</body>
</html>
